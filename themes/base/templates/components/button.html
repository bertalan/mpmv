{% load i18n %}{% comment %}
Button (THM.4, spec 14 §14.6, §14.9): a `<button>`, or a link styled as one when `url` is set.
Include it with `only`:

  {% include "components/button.html" with label=_("Save") type="submit" only %}

Context:
- `label` (required): the visible text, or the accessible name of an icon-only button.
- `variant`: "primary" (default), "secondary", "ghost", "link" or "danger".
- `size`: "small" (24 px targets, for dense tools), "large", or nothing for the 44 px default.
- `type`: "button" (default), "submit" or "reset"; `name` and `value` for a submit button.
- `url`: render a link (`<a>`) instead of a button.
- `icon`: one of close, search, plus, minus, menu, check (components/icon.html), drawn before
  the label and hidden from assistive technology.
- `icon_only`: show the icon alone; the label becomes the `aria-label` (WCAG 1.1.1, 4.1.2).
  While loading, the loading text joins it ("Refresh, Loading"): the label replaces the content.
- `disabled`: a disabled button, or a link with no `href` and `aria-disabled="true"`.
- `loading`: the action is running: `aria-busy`, `aria-disabled` (the button keeps the focus),
  a spinner and `loading_label` (default "Loading") for screen readers. The theme script
  (base.js) cancels clicks and submits from any `aria-disabled="true"` control.
- `controls`, `expanded`: `aria-controls` and `aria-expanded` for a disclosure button.
- `extra_class`: more classes, for example to place the button in a layout.

Colours come from the component tokens (--button-bg, --button-fg, --button-bg-hover), which a
theme may override; the danger variant uses --color-danger.
{% endcomment %}{% if url %}<a class="button{% if variant and variant != 'primary' %} button--{{ variant }}{% endif %}{% if size %} button--{{ size }}{% endif %}{% if icon_only %} button--icon{% endif %}{% if loading %} button--loading{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}"{% if disabled or loading %} aria-disabled="true"{% else %} href="{{ url }}"{% endif %}{% if loading %} aria-busy="true"{% endif %}{% if icon_only %} aria-label="{{ label }}{% if loading %}, {% firstof loading_label _("Loading") %}{% endif %}"{% endif %}>{% else %}<button type="{{ type|default:'button' }}" class="button{% if variant and variant != 'primary' %} button--{{ variant }}{% endif %}{% if size %} button--{{ size }}{% endif %}{% if icon_only %} button--icon{% endif %}{% if loading %} button--loading{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}"{% if name %} name="{{ name }}"{% endif %}{% if value %} value="{{ value }}"{% endif %}{% if disabled %} disabled{% endif %}{% if loading %} aria-busy="true" aria-disabled="true"{% endif %}{% if icon_only %} aria-label="{{ label }}{% if loading %}, {% firstof loading_label _("Loading") %}{% endif %}"{% endif %}{% if controls %} aria-controls="{{ controls }}" aria-expanded="{% if expanded %}true{% else %}false{% endif %}"{% endif %}>{% endif %}
  {% if loading %}<span class="button__spinner" aria-hidden="true"></span>{% endif %}{% if icon %}{% include "components/icon.html" with name=icon only %}{% endif %}{% if not icon_only %}{{ label }}{% endif %}{% if loading and not icon_only %}<span class="visually-hidden">{% firstof loading_label _("Loading") %}</span>{% endif %}
{% if url %}</a>{% else %}</button>{% endif %}
