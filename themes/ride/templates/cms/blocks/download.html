{% comment %}Download block of the `ride` theme (CMS.15): a raised row; the link text carries title, type and size (copied from base's, which hides the block without a readable file).{% endcomment %}{% if download %}<p class="block block-download ride-download"><a class="ride-download__link" href="{{ download.url }}" download><span class="block-download__title">{{ download.title }}</span> <span class="block-download__details">({{ download.details }})</span></a></p>{% endif %}
