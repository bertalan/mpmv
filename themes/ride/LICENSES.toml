# Licences of the `ride` theme's third-party and own assets (spec 14 §14.8, THM.5 gate).
# Format: see themes/base/LICENSES.toml.

[[asset]]
name = "Barlow"
kind = "font"
source = "https://github.com/google/fonts/tree/5bb28733cec313b63fbd415b574b5ae35c8aa8b8/ofl/barlow"
author = "Jeremy Tribby"
license = "OFL-1.1"
# Subset to Latin and Latin Extended-A (fonttools pyftsubset, woff2) from Barlow-Regular.ttf and
# Barlow-Bold.ttf of the upstream Google Fonts repository, commit 5bb28733. The copyright notice
# and the licence text are licenses/OFL.txt, a copy of ofl/barlow/OFL.txt at that commit (the
# upstream file reserves no font name). The subsets keep the font name table.
files = ["fonts/barlow-400.woff2", "fonts/barlow-700.woff2", "licenses/OFL.txt"]

[[asset]]
name = "Barlow Condensed"
kind = "font"
source = "https://github.com/google/fonts/tree/5bb28733cec313b63fbd415b574b5ae35c8aa8b8/ofl/barlowcondensed"
author = "Jeremy Tribby"
license = "OFL-1.1"
# Subset like Barlow, from BarlowCondensed-SemiBold.ttf and BarlowCondensed-Bold.ttf, same
# commit; its OFL.txt has the same copyright line and text as Barlow's.
files = [
  "fonts/barlow-condensed-600.woff2",
  "fonts/barlow-condensed-700.woff2",
  "licenses/OFL.txt",
]

[[asset]]
name = "Lucide"
kind = "icons"
source = "https://github.com/lucide-icons/lucide/tree/b826f0c527e1498f5e46f41ca0277ccab144bf31/icons"
author = "Lucide Icons and Contributors"
license = "ISC"
# Release 1.70.0, commit b826f0c5. Only the 13 icons the theme draws (x, search, plus, minus,
# menu, check, star, shopping-cart, chevron-left, chevron-right, chevron-down, zoom-in,
# arrow-right), joined in one same-origin sprite. The sprite ids are our names (`cart` is
# shopping-cart, `zoom` is zoom-in, `close` is x). licenses/LUCIDE-LICENSE.txt is upstream's
# LICENSE (ISC, plus the MIT text for the icons derived from Feather) at that commit.
files = ["icons/sprite.svg", "licenses/LUCIDE-LICENSE.txt"]

[[asset]]
name = "Ride placeholder artwork"
kind = "image"
source = "https://github.com/bertalan/mpmv"
author = "MPMV project"
license = "CC0-1.0"
# Our own work: simple vector shapes, no photograph. Shown behind the hero until an editor
# chooses a hero image; the product placeholder fills the card of a product with no image (THM.18).
files = ["images/hero-placeholder.svg", "images/product-placeholder.svg"]

[[asset]]
name = "Ride surface textures"
kind = "image"
source = "https://github.com/bertalan/mpmv"
author = "MPMV project"
license = "CC0-1.0"
# Our own work, drawn from scratch as plain paths (THM.20), no reference artwork: a torn edge
# (a mask, one jagged path) and a light topographic pattern (open and closed contour lines,
# tiled). Each file is under 4 KB. Used by the `edge-torn` and `texture-topo` utilities.
files = ["images/edge-torn.svg", "images/texture-topo.svg"]

[[asset]]
name = "Ride error-page illustration"
kind = "image"
source = "https://github.com/bertalan/mpmv"
author = "MPMV project"
license = "CC0-1.0"
# Our own work, drawn from scratch as plain paths (THM.30), no reference artwork: a winding road
# with a dashed centre line under contour lines, as the full-bleed background of the 404 and 500
# pages. Under 4 KB.
files = ["images/error-road.svg"]

[[asset]]
name = "Social brand glyphs"
kind = "image"
source = "https://github.com/simple-icons/simple-icons/tree/13.0.0"
author = "Simple Icons Collaborators"
license = "CC0-1.0"
# Release 13.0.0 (CC0-1.0): one path per network of the CMS.17 list, as `social-<network>`
# symbols in icons/sprite.svg (THM.22). The brand marks remain the property of their owners.
files = ["icons/sprite.svg"]

[[asset]]
name = "Bootstrap"
kind = "framework"
source = "https://github.com/twbs/bootstrap/releases/tag/v5.3.9"
author = "The Bootstrap Authors"
license = "MIT"
# Release 5.3.9, official dist files unchanged: vendor/bootstrap/bootstrap.min.css and
# bootstrap.bundle.min.js (code, hashed in VENDORED.toml). The dist zip has no LICENSE file; the
# one here is the standard MIT text with upstream's copyright line.
files = ["vendor/bootstrap/LICENSE", "vendor/bootstrap/VENDORED.toml"]

[[asset]]
name = "Ride language flags"
kind = "image"
source = "https://github.com/bertalan/mpmv"
author = "MPMV project"
license = "CC0-1.0"
# THM.35: our own drawings of plain civil flags (no coat of arms) as flat rectangles; the designs
# of national flags are public domain. The 1 px outline is CSS (the control-border token), not
# part of the file. Under 1 KB each.
files = [
  "flags/bg.svg", "flags/cz.svg", "flags/de.svg", "flags/dk.svg", "flags/es.svg",
  "flags/fi.svg", "flags/fr.svg", "flags/gb.svg", "flags/gr.svg", "flags/hu.svg",
  "flags/it.svg", "flags/nl.svg", "flags/pl.svg", "flags/ro.svg", "flags/se.svg",
]

# THM.38: the ride site icon, the same "M" mark in the ride red. Own work.
[[asset]]
name = "MPMV site icon (ride)"
kind = "image"
source = "https://github.com/bertalan/mpmv"
author = "MPMV contributors"
license = "CC0-1.0"
files = ["site-icon/icon.svg", "site-icon/icon-32.png", "site-icon/apple-touch-icon.png"]
