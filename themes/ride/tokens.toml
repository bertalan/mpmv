# Design tokens of the `ride` theme (spec 14 §14.4, THM.6). Only what differs from `base`.
# The palette is the operator palette of spec 14 §14.4 and §14.12; layout, type and shapes
# follow the lane-a brief. Every text pair is checked by the token contract and by
# apps/themes/tests/unit/test_ride_theme.py. Operator palette values override the colour defaults
# (spec 14 §14.12) through custom-property overrides, so CSS uses `var(--…)` for every colour.

# --- Primitive tier

# The colour defaults are the Red palette of spec 14 §14.12 (owner decision 2026-11-21, THM.31).
# A site may choose Blue, Petrol or another palette in its theme settings; the palette stylesheet
# then overrides these custom properties, so they stay the build-time default.

[color.brand]
50 = "#FDECEE"  # tint: primary text on it 5.45:1
400 = "#FF6B6B"  # primary in dark mode (6.65:1 on #121417), not wired yet
500 = "#C40417"  # primary: text, link, UI colour and fill (white on it 6.22:1)
700 = "#9E0312"  # primary hover (white on it 8.48:1)

[color.charcoal]
400 = "#2B3138"  # secondary: background and text, white on it 13.13:1
500 = "#1B2026"  # secondary hover

[color.ink]
950 = "#1A1A1A"
900 = "#242424"
800 = "#343434"
600 = "#646464"

[color.slate]
700 = "#30373F"

[color.navy]
950 = "#051026"

[color.gray]
50 = "#F9F9F9"
100 = "#F3F3F3"
200 = "#E5E5E5"
300 = "#D5D5D5"
500 = "#8A8A8A"

[color.blue]
500 = "#2F80ED"  # focus: at least 3:1 on white and on the dark surface
300 = "#7DB3FA"  # focus on the dark band: at least 4.5:1 on the dark surface

# --- Semantic tier

[color]
text = "{color.ink.800}"
heading = "{color.ink.900}"
text-muted = "{color.ink.600}"
surface-raised = "{color.gray.50}"
surface-sunken = "{color.gray.100}"
surface-inverse = "{color.slate.700}"
border = "{color.gray.200}"
border-strong = "{color.gray.300}"
border-control = "{color.gray.500}"
accent = "{color.brand.500}"
accent-hover = "{color.brand.700}"
accent-tint = "{color.brand.50}"
accent-dark = "{color.brand.400}"
secondary = "{color.charcoal.400}"
on-secondary = "#FFFFFF"
secondary-hover = "{color.charcoal.500}"
secondary-text = "{color.charcoal.400}"
link = "{color.brand.500}"
focus = "{color.blue.500}"
focus-on-dark = "{color.blue.300}"
info = "{color.slate.700}"
overlay = "{color.navy.950}"

[font]
body = "'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif"
display = "'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif"

# Body 18 px on desktop and 16 px on mobile; h1 48, h2 36, h3 24, h4 20 px on desktop, fluid
# down to mobile. `step.display` is the hero heading, up to 88 px.
[step]
0 = "clamp(1rem, 0.96rem + 0.2vw, 1.125rem)"
1 = "clamp(1.125rem, 1.05rem + 0.3vw, 1.25rem)"
2 = "clamp(1.375rem, 1.2rem + 0.6vw, 1.5rem)"
3 = "clamp(1.75rem, 1.4rem + 1.1vw, 2.25rem)"
4 = "clamp(2.25rem, 1.75rem + 1.5vw, 3rem)"
5 = "clamp(2.75rem, 2rem + 2.5vw, 3.5rem)"
display = "clamp(3rem, 1.5rem + 6vw, 5.5rem)"

[space]
section = "clamp(4rem, 2rem + 6vw, 7rem)"
section-end = "clamp(3rem, 1.5rem + 4vw, 5rem)"

[radius]
control = "4px"
card = "10px"
pill = "999px"
round = "50%"

[shadow]
button-hover = "0 6px 16px color-mix(in srgb, var(--color-accent) 28%, transparent)"

# Image overlay scrim (THM.20): `opacity` is the strong end (hero, tiles), `soft` the light one.
[scrim]
opacity = "0.82"
soft = "0.45"

# Section surfaces (THM.20): each variant names its background and the colours of its heading,
# text, link, focus ring and button, all derived from the palette tokens, so a palette change
# carries every pair along. apps/themes/tests/unit/test_ride_surfaces.py checks the pairs under
# each predefined palette. On the dark and primary bands the link and the button are inverted.
[surface.light]
bg = "{color.surface}"
text = "{color.text}"
heading = "{color.heading}"
link = "{color.link}"
focus = "{color.focus}"
button-bg = "{color.accent}"
button-fg = "{color.on-accent}"
button-hover = "{color.accent-hover}"

[surface.muted]
bg = "{color.surface-sunken}"
text = "{color.text}"
heading = "{color.heading}"
link = "{color.link}"
focus = "{color.focus}"
button-bg = "{color.accent}"
button-fg = "{color.on-accent}"
button-hover = "{color.accent-hover}"

[surface.band]
bg = "{color.surface-inverse}"
text = "{color.text-inverse}"
heading = "{color.text-inverse}"
link = "{color.text-inverse}"
focus = "{color.focus-on-dark}"
button-bg = "{color.text-inverse}"
button-fg = "{color.surface-inverse}"
button-hover = "{color.accent-tint}"

[surface.primary]
bg = "{color.accent}"
text = "{color.on-accent}"
heading = "{color.on-accent}"
link = "{color.on-accent}"
focus = "{color.on-accent}"
button-bg = "{color.on-accent}"
button-fg = "{color.accent}"
button-hover = "{color.accent-tint}"

[header]
height = "4.5rem"

# --- Component tier

[button]
bg = "{color.accent}"
bg-hover = "{color.accent-hover}"

[card]
padding = "clamp(1.5rem, 1rem + 2vw, 3rem)"
radius = "{radius.card}"

[measure]
page = "78rem"
