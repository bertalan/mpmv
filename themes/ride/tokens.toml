# Design tokens of the `ride` theme (spec 14 §14.4, THM.6). Only what differs from `base`.
# The palette is the operator palette of spec 14 §14.4 and §14.12; layout, type and shapes
# follow the lane-a brief. Every text pair is checked by the token contract and by
# apps/themes/tests/unit/test_ride_theme.py. Operator palette values override the colour defaults
# (spec 14 §14.12) through custom-property overrides, so CSS uses `var(--…)` for every colour.

# --- Primitive tier

[color.brand]
50 = "#EEF6FF"  # tint: primary text on it 4.77:1
500 = "#046BD2"  # primary: text, link, UI colour and fill (white on it 5.20:1)
700 = "#035AB1"  # primary hover (white on it 6.77:1)

[color.amber]
400 = "#FBA926"  # secondary: background only, always with dark text (8.95:1)
500 = "#E89A1E"  # secondary hover (dark text on it 7.52:1)

[color.orange]
700 = "#BE5900"  # secondary as text (4.55:1 on white)

[color.ink]
950 = "#1A1A1A"
900 = "#242424"
800 = "#343434"
600 = "#646464"

[color.slate]
700 = "#30373F"

[color.navy]
950 = "#051026"

[color.gray]
50 = "#F9F9F9"
100 = "#F3F3F3"
200 = "#E5E5E5"
300 = "#D5D5D5"
500 = "#8A8A8A"

[color.blue]
500 = "#2F80ED"  # focus: at least 3:1 on white and on the dark surface

# --- Semantic tier

[color]
text = "{color.ink.800}"
heading = "{color.ink.900}"
text-muted = "{color.ink.600}"
surface-raised = "{color.gray.50}"
surface-sunken = "{color.gray.100}"
surface-inverse = "{color.slate.700}"
border = "{color.gray.200}"
border-strong = "{color.gray.300}"
border-control = "{color.gray.500}"
accent = "{color.brand.500}"
accent-hover = "{color.brand.700}"
accent-tint = "{color.brand.50}"
secondary = "{color.amber.400}"
on-secondary = "{color.ink.950}"
secondary-hover = "{color.amber.500}"
secondary-text = "{color.orange.700}"
link = "{color.brand.500}"
focus = "{color.blue.500}"
info = "{color.slate.700}"
overlay = "{color.navy.950}"

[font]
body = "'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif"
display = "'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif"

# Body 18 px on desktop and 16 px on mobile; h1 48, h2 36, h3 24, h4 20 px on desktop, fluid
# down to mobile. `step.display` is the hero heading, up to 88 px.
[step]
0 = "clamp(1rem, 0.96rem + 0.2vw, 1.125rem)"
1 = "clamp(1.125rem, 1.05rem + 0.3vw, 1.25rem)"
2 = "clamp(1.375rem, 1.2rem + 0.6vw, 1.5rem)"
3 = "clamp(1.75rem, 1.4rem + 1.1vw, 2.25rem)"
4 = "clamp(2.25rem, 1.75rem + 1.5vw, 3rem)"
5 = "clamp(2.75rem, 2rem + 2.5vw, 3.5rem)"
display = "clamp(3rem, 1.5rem + 6vw, 5.5rem)"

[space]
section = "clamp(4rem, 2rem + 6vw, 7rem)"
section-end = "clamp(3rem, 1.5rem + 4vw, 5rem)"

[radius]
control = "4px"
card = "10px"
pill = "999px"
round = "50%"

[shadow]
button-hover = "0 6px 16px rgb(4 107 210 / 0.28)"

[scrim]
opacity = "0.82"

[header]
height = "4.5rem"

# --- Component tier

[button]
bg = "{color.accent}"
bg-hover = "{color.accent-hover}"

[card]
padding = "clamp(1.5rem, 1rem + 2vw, 3rem)"
radius = "{radius.card}"

[measure]
page = "78rem"
