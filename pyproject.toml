[project]
name = "mpmv"
version = "0.1.0"
description = "Multivendor marketplace on Django + Wagtail"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "django>=6.1,<6.2",
  "psycopg[binary]>=3.3",
  "dj-database-url>=2.3",
  "django-stubs-ext>=5.2",
  "procrastinate[django]>=3.10",
  "croniter>=6.2",
  "gunicorn>=26.0",
  "whitenoise>=6.12",
  "django-ninja>=1.7.3",
  "django-otp>=1.7.5",
  "webauthn>=3.0.1",
  "segno>=1.6.6",
  "cryptography>=50.0.2",
  "wagtail>=8.1,<8.2",
  "wagtail-localize>=1.14.5,<1.15",
  "defusedxml>=0.7.1",  # SVG logo checks (THM.12)
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-django>=4.11",
  "pytest-cov>=6.2",
  "ruff>=0.13",
  "mypy>=1.18",
  "django-stubs[compatible-mypy]>=5.2",
  "import-linter>=2.5",
  "pre-commit>=4.3",
  "pytest-playwright>=0.7",
  "factory-boy>=3.3.3",
  "openapi-spec-validator>=0.9.0",
  # OPS.4: workflow and Dependabot config checks, CycloneDX SBOM of the Python environment.
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0",
  "check-jsonschema>=0.39.0",
  "cyclonedx-bom>=7.6.0,<8",
  # SEC.5: property-based tests over the hostile-input corpus (tests/hostile_input.py).
  # Exact pin on purpose: the derandomized `ci` profile (conftest.py) replays the same examples
  # only on the same Hypothesis version, and Hypothesis releases several times a week. A bump
  # comes as its own Dependabot PR, so a new failing example points at the bump, not at a change
  # in our code (docs/dev/dependency-updates.md).
  "hypothesis==6.170.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["build", "private", ".claude", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DJ", "S", "RUF", "PT"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"tests/**" = ["S101", "S105", "S106"]
"conftest.py" = ["S101"]
"tools/**" = ["S", "E501", "RUF005"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["^build/", "^private/", "^tools/", "^\\.claude/"]
# factory_boy ships py.typed but its public API is untyped and re-exported implicitly (ARC.12).
untyped_calls_exclude = ["factory"]

[[tool.mypy.overrides]]
module = [
  "dj_database_url", "croniter", "django_otp", "django_otp.*", "whitenoise", "whitenoise.*",
  "gunicorn", "gunicorn.*", "defusedxml", "defusedxml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Wagtail and its dependencies ship no type information (CMS.1).
module = [
  "wagtail", "wagtail.*", "modelcluster", "modelcluster.*", "modelsearch", "modelsearch.*",
  "taggit", "taggit.*", "treebeard", "treebeard.*", "wagtail_localize", "wagtail_localize.*",
  "willow", "willow.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated migrations name Wagtail's swappable page model setting, which only Wagtail defines.
module = ["apps.cms.migrations.*", "apps.core.migrations.*", "apps.events.migrations.*"]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["factory", "factory.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# MFA devices subclass django-otp's untyped Device, whose managers the plugin cannot resolve (CORE.4).
module = ["apps.accounts.models"]
disable_error_code = ["django-manager-missing"]

[[tool.mypy.overrides]]
module = ["apps.*.tests.factories"]
disallow_untyped_decorators = false  # factory.post_generation

[tool.django-stubs]
django_settings_module = "mpmv.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mpmv.settings.test"
addopts = "-ra --strict-markers"
testpaths = ["tests", "apps"]
norecursedirs = [".claude", "build", "private", ".venv", "node_modules"]
python_files = ["test_*.py"]
filterwarnings = [
  # Raised by pytest-base-url (a pytest-playwright dependency), not by our code.
  "ignore:Session-scoped fixtures defined as instance methods",
]
markers = [
  "unit: pure functions, no database (ADR-0006)",
  "integration: real Django + PostgreSQL",
  "e2e: Playwright against a live server",
]

[tool.coverage.run]
source = ["apps", "mpmv"]
branch = true

[tool.importlinter]
root_packages = ["apps", "mpmv"]
include_external_packages = true  # needed to forbid third-party imports (procrastinate)

# App dependency graph from spec 01 §1.3: an arrow A → B means B may import A, never the reverse.
[[tool.importlinter.contracts]]
name = "Domain layers (lower layers never import higher ones)"
type = "layers"
layers = [
  "apps.seed",  # the demo seed (ARC.10) writes every app's data through its services
  "apps.mcp",
  "apps.api",
  "apps.compliance | apps.seo | apps.ingest",
  "apps.ledger",
  "apps.payments",
  "apps.orders",
  "apps.cart",
  "apps.events",  # event pages link products and categories and use the CMS blocks (spec 15)
  "apps.cms",  # reads catalog terms and vendor storefronts (CMS.2 cards)
  "apps.catalog | apps.tax | apps.shipping",
  "apps.vendors",
  "apps.accounts",
  "apps.core",
]
exhaustive = false

# The layer above lets cms import catalog and vendors (spec 01: catalog --> cms). It sits above
# tax and shipping only because import-linter layers are a total order: the graph has no
# tax --> cms or shipping --> cms edge, so this contract keeps cms off them.
[[tool.importlinter.contracts]]
name = "CMS reads catalog and vendors, never tax or shipping (spec 01 graph)"
type = "forbidden"
source_modules = ["apps.cms"]
forbidden_modules = ["apps.tax", "apps.shipping"]

[[tool.importlinter.contracts]]
name = "Procrastinate is used only through apps.core.tasks (ADR-0004)"
type = "forbidden"
source_modules = ["apps", "mpmv"]
forbidden_modules = ["procrastinate"]
ignore_imports = ["apps.core.tasks -> procrastinate"]
allow_indirect_imports = true

# Spec 14 §14.3: `themes` imports only core (and Wagtail), and no domain app imports it: apps
# only use its templates and context. THM.11 will let `apps.vendors` import the pure palette
# functions of `apps.themes.engine` (vendor branding) with an `ignore_imports` entry here.
[[tool.importlinter.contracts]]
name = "Themes depend only on core"
type = "forbidden"
source_modules = ["apps.themes"]
forbidden_modules = [
  "apps.accounts",
  "apps.vendors",
  "apps.catalog",
  "apps.tax",
  "apps.shipping",
  "apps.cart",
  "apps.orders",
  "apps.payments",
  "apps.ledger",
  "apps.ingest",
  "apps.cms",
  "apps.events",
  "apps.seo",
  "apps.compliance",
  "apps.api",
  "apps.seed",  # the demo seed (ARC.10) writes every app's data through its services
  "apps.mcp",
]

[[tool.importlinter.contracts]]
name = "No app imports themes"
type = "forbidden"
source_modules = [
  "apps.core",
  "apps.accounts",
  "apps.vendors",
  "apps.catalog",
  "apps.tax",
  "apps.shipping",
  "apps.cart",
  "apps.orders",
  "apps.payments",
  "apps.ledger",
  "apps.ingest",
  "apps.cms",
  "apps.events",
  "apps.seo",
  "apps.compliance",
  "apps.api",
  "apps.seed",  # the demo seed (ARC.10) writes every app's data through its services
  "apps.mcp",
  "mpmv",
]
forbidden_modules = ["apps.themes"]

[[tool.importlinter.contracts]]
name = "Tax and shipping engines stay independent of orders and cart"
type = "forbidden"
source_modules = ["apps.tax", "apps.shipping"]
forbidden_modules = ["apps.orders", "apps.cart", "apps.payments", "apps.ledger", "apps.events"]

# Spec 15: nothing in the checkout reads events. cart and orders sit above events in the
# layers, so this contract keeps them off it.
[[tool.importlinter.contracts]]
name = "The checkout never imports events (spec 15)"
type = "forbidden"
source_modules = ["apps.cart", "apps.orders"]
forbidden_modules = ["apps.events"]

# ARC.18 (spec 01 §1.3): engines are pure functions, with no database or ORM access.
# import-linter forbids an external package only as a whole (`django`, not `django.db`), so
# engines import no Django at all; the pure `slugify` helper comes through apps.core.text.
[[tool.importlinter.contracts]]
name = "Engines are pure: no Django, models or services in apps.*.engine (ARC.18)"
type = "forbidden"
source_modules = ["apps.*.engine"]
forbidden_modules = ["django", "apps.*.models", "apps.*.services"]
ignore_imports = ["apps.core.text -> django"]
