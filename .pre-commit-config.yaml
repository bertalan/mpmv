repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Vendored files stay byte-identical to upstream: VENDORED.toml records their SHA-256.
      - id: end-of-file-fixer
        exclude: ^(apps/themes/static/vendor|tests/e2e/vendor)/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(apps/themes/static/vendor|tests/e2e/vendor)/
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        # axe-core (THM.5) is a pinned, hashed test tool of about 540 KB.
        exclude: ^tests/e2e/vendor/axe\.min\.js$
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: docs-check
        name: backlog is up to date with the spec
        entry: uv run tools/build_docs.py --check
        language: system
        pass_filenames: false
        files: ^docs/spec/.*\.md$
