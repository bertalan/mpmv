{% load i18n %}{% get_current_language as current %}{% get_available_languages as available %}{% get_language_info_list for available as languages %}
<form class="language-switcher" action="{% url 'switch_language' %}" method="post">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% for language in languages %}
    <button type="submit" name="language" value="{{ language.code }}" lang="{{ language.code }}"{% if language.code == current %} aria-current="true" disabled{% endif %}>{{ language.name_local|capfirst }}</button>
  {% endfor %}
</form>
