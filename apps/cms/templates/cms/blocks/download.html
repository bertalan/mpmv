{% comment %}The download block (CMS.15): one link whose text is the file's title, type and size, so a screen reader announces all three. Nothing is rendered without a readable file.{% endcomment %}{% if download %}<p class="block block-download"><a href="{{ download.url }}" download><span class="block-download__title">{{ download.title }}</span> <span class="block-download__details">({{ download.details }})</span></a></p>{% endif %}
