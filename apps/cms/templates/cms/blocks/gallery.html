{% load wagtailimages_tags image_credits %}
<ul class="gallery">
  {% for item in images %}
    {% image_credit_of item.image as credit %}
    <li>
      <figure>
        {% image item.image fill-480x360 alt=item.alt_text %}
        {% if item.caption or credit %}<figcaption>{{ item.caption }}{% if credit %} {% include "core/components/image_credit.html" %}{% endif %}</figcaption>{% endif %}
      </figure>
    </li>
  {% endfor %}
</ul>
