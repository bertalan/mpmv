{% extends "layouts/content.html" %}
{% load wagtailcore_tags image_credits responsive_images %}
{% block page_content %}
  <article>
    <h1>{{ page.title }}</h1>
    {% if page.image %}
      {% image_credit_of page.image as credit %}
      <figure>
        {% responsive_image page.image "content" alt=page.image_alt_text priority=True %}
        {% if page.image_caption or credit %}<figcaption>{{ page.image_caption }}{% if credit %} {% include "core/components/image_credit.html" %}{% endif %}</figcaption>{% endif %}
      </figure>
    {% endif %}
    {% for block in page.body %}{% include_block block %}{% endfor %}
  </article>
{% endblock %}
