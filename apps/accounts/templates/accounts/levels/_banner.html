{% if mode == "operational" %}
<div class="session-level session-level--operational" role="status">
  <strong>Operational mode</strong>
  <span>About {{ minutes_left }} min left. It also ends when you sign out or after inactivity.</span>
  <form action="{% url 'levels:end' %}" method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit">End now</button></form>
</div>
{% elif mode == "restricted" %}
<div class="session-level session-level--restricted" role="status">
  <strong>Secure mode</strong>
  <span>Sensitive actions ask you to switch to Operational mode or to do them once.</span>
</div>
{% endif %}
