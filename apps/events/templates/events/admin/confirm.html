{% extends "wagtailadmin/generic/base.html" %}
{% load i18n %}
{% block main_content %}
  <p>{{ explanation }}</p>
  {% include "events/admin/_errors.html" %}
  <form action="{{ request.path }}" method="post">
    {% csrf_token %}
    <div>
      <button class="button" type="submit">{{ submit_label }}</button>
      <a href="{{ edit_url }}" class="button button-secondary">{% translate "Back to the event" %}</a>
    </div>
  </form>
{% endblock %}
