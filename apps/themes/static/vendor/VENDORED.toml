# Third-party JavaScript and its assets served from 'self' (THM.3, spec 14 §14.5): no CDN at runtime.
# Every file in this directory has one entry. `sha256` is the hash of the file exactly as
# downloaded from `source`; apps/themes/tests/unit/test_vendored.py fails on any mismatch, on a
# file without an entry and on a version that is not an exact x.y.z.
# To update: download the new version from the pinned URL, replace the file, update the entry.

[[file]]
path = "htmx.min.js"
name = "htmx"
