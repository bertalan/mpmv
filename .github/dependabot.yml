# Automated dependency updates (OPS.4, spec 12 §12.5). Review guide: docs/dev/dependency-updates.md.
# Every Monday Dependabot opens one grouped PR per ecosystem for minor and patch updates, and one
# PR per major update. Update PRs run the full CI like any other PR; nobody merges a red one.
# Security updates (Dependabot alerts) are not grouped and are not delayed by the cooldown.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    commit-message:
      prefix: OPS.4
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        # Framework feature releases carry deprecations and migrations: always their own PR.
        exclude-patterns: [django, wagtail]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: OPS.4
    # Dependabot supports semver-specific cooldowns only for some ecosystems (not this one).
    cooldown:
      default-days: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Base images in the Containerfile, pinned by tag and digest: Dependabot bumps both together.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    commit-message:
      prefix: OPS.4
    # Dependabot supports semver-specific cooldowns only for some ecosystems (not this one).
    cooldown:
      default-days: 5
    ignore:
      # A new Python minor also changes requires-python, .python-version and CI: a planned task.
      - dependency-name: "*python"
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      images-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
