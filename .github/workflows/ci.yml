# CI pipeline (ARC.4, ADR-0006). All jobs are required before merging into main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels an older run on a PR branch, but never on main: every main commit
  # keeps its own verdict, so a release can be gated on its exact sha (OPS release slot).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  DJANGO_SETTINGS_MODULE: mpmv.settings.test
  # Throwaway service database with trust auth: no credentials in the repository.
  DATABASE_URL: postgres://mpmv@localhost:5432/mpmv

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - name: Ruff (lint + format)
        run: |
          uv run ruff check . --output-format github
          uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy .
      - name: Import contracts (app dependency graph)
        run: uv run lint-imports
      - name: Backlog up to date with the spec
        run: uv run tools/build_docs.py --check
      # THM.5: token contract, CSP lint, size budgets, fonts and LICENSES.toml of every theme.
      - name: Theme quality gates
        run: uv run python -m apps.themes.gates
      - name: Django system checks and missing migrations
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      # CORE.7: publish the API v1 OpenAPI schema as a build artifact until STAGE serves it.
      - name: Export and validate the OpenAPI schema
        run: |
          mkdir -p build
          uv run python manage.py export_openapi_schema --api apps.api.v1.api.api \
            --indent 2 --output build/openapi-v1.json
          uv run openapi-spec-validator build/openapi-v1.json
      - name: Store the OpenAPI schema
        uses: actions/upload-artifact@v7
        with:
          name: openapi-v1
          path: build/openapi-v1.json
      - name: Dependency audit (pip-audit)
        run: make audit
      # OPS.4: CycloneDX SBOM of the production Python environment (no dev dependencies).
      - name: Python SBOM (CycloneDX)
        run: make sbom
      - name: Store the Python SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-python
          path: build/sbom/mpmv-python.cdx.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Unit + integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mpmv
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mpmv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpmv -d mpmv"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      # Throwaway service database: durability is worthless here, and the migration and flush
      # tests write a lot. All three settings reload without a restart.
      - name: PostgreSQL without fsync
        run: |
          psql "$DATABASE_URL" -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      # No coverage here: branch tracing roughly doubles the run time. `make test` still reports it.
      - name: Pytest (unit + integration)
        run: >-
          uv run pytest -n auto --dist loadgroup --durations=40 -m "unit or integration"
          --junitxml=build/reports/junit.xml
      # I18N.15: the unit suite again with English absent from the site languages (primary Italian,
      # then German): no test may assume `en`. Unit tests need no database; about one minute.
      - name: Pytest (unit, MPMV_LANGUAGES=it,de)
        env:
          MPMV_LANGUAGES: it,de
        run: uv run pytest -n auto -m unit
      # I18N.15: model defaults must not freeze the primary language: no migration drift either.
      - name: Missing migrations (MPMV_LANGUAGES=it,de)
        env:
          MPMV_LANGUAGES: it,de
        run: uv run python manage.py makemigrations --check --dry-run
      # CORE.18 follow-up: an upgrade from the previous release runs the database checks before
      # `migrate` applies anything. Migrate fully, step the manager app back and drop the role
      # groups, then migrate again with the checks on (no --skip-checks): it must exit 0.
      - name: Upgrade path (migrate with checks over an older schema)
        run: |
          uv run python manage.py migrate
          uv run python manage.py migrate manager 0001
          uv run python manage.py shell -c "from django.contrib.auth.models import Group; Group.objects.all().delete()"
          uv run python manage.py migrate
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/

  image-build:
    # ARC.5: the Containerfile builds on a standard OCI builder (ADR-0002) and the image migrates,
    # serves and passes its own health check against PostgreSQL.
    # ARC.13: once per architecture, each on a native runner (no QEMU), so an arm64 break shows
    # up on the PR. The required check is the "Container image" gate job below.
    # ARC.23: the parity smoke deploys the image with mpmv-deploy under the real Quadlet units, the
    # production Caddyfile and PostgreSQL over TLS verify-full (deploy/ci/parity-smoke.sh).
    name: Container image (${{ matrix.arch }})
    # Draft PRs run the light jobs only (runner time, owner 2026-11-11); ready PRs, merge trains and
    # main run everything, so nothing reaches main without this job.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the Containerfile
        run: >-
          docker build --file Containerfile --tag mpmv-app:ci
          --build-arg MPMV_VERSION=ci-${GITHUB_SHA::12} .
      - name: Built for the runner's architecture
        run: test "$(docker image inspect --format '{{.Architecture}}' mpmv-app:ci)" = "${{ matrix.arch }}"
      # OPS.4: CycloneDX SBOM of the built image (OS packages and the app virtualenv), via syft.
      - run: mkdir -p build/sbom
      - name: Image SBOM (CycloneDX)
        id: sbom
        # The action downloads syft from GitHub release assets; when those downloads fail
        # (HTTP 504 on 2026-11-08), the fallback below runs the official syft image instead.
        continue-on-error: true
        uses: anchore/sbom-action@v0.24.3
        with:
          image: mpmv-app:ci
          format: cyclonedx-json
          output-file: build/sbom/mpmv-image-${{ matrix.arch }}.cdx.json
          upload-artifact: false
      - name: Image SBOM fallback (syft container)
        if: steps.sbom.outcome == 'failure'
        run: |
          chmod 0777 build/sbom
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/build/sbom:/out" \
            anchore/syft:v1.54.0 mpmv-app:ci -o cyclonedx-json=/out/mpmv-image-${{ matrix.arch }}.cdx.json
      # Fails the job when neither step produced the SBOM: never a silently missing SBOM.
      - name: Image SBOM present
        run: test -s build/sbom/mpmv-image-${{ matrix.arch }}.cdx.json
      - name: Store the image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-image-${{ matrix.arch }}
          path: build/sbom/mpmv-image-${{ matrix.arch }}.cdx.json
      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id mpmv-app:ci -u)" = "10001"
      # THM.2: every theme under themes/ has a hashed theme.css in the collected static files.
      - name: Hashed theme.css for every theme
        run: |
          docker run --rm --entrypoint python mpmv-app:ci -c '
          import json, pathlib, re
          paths = json.loads(pathlib.Path("staticfiles/staticfiles.json").read_text())["paths"]
          slugs = sorted(p.name for p in pathlib.Path("themes").iterdir() if (p / "theme.toml").is_file())
          assert slugs, "no themes"
          for slug in slugs:
              hashed = paths[f"themes/{slug}/theme.css"]
              assert re.fullmatch(rf"themes/{slug}/theme\.[0-9a-f]{{12}}\.css", hashed), hashed
              assert pathlib.Path("staticfiles", hashed).is_file(), hashed
              print(slug, "->", hashed)
          '
      - name: Production parity smoke (units, Caddy, TLS database, seed, rollback)
        run: deploy/ci/parity-smoke.sh mpmv-app:ci

  image:
    # Branch protection requires this check. It passes only when both architectures passed; it
    # runs even when a build fails, because a skipped required check would count as passing.
    name: Container image
    needs: image-build
    if: always()
    runs-on: ubuntu-24.04
    env:
      BUILD_RESULT: ${{ needs.image-build.result }}
      IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
    steps:
      - name: Both architectures built and passed (skipped only on a draft PR)
        run: test "$BUILD_RESULT" = success || { test "$IS_DRAFT" = true && test "$BUILD_RESULT" = skipped; }

  e2e:
    name: E2E (Playwright)
    # Draft PRs run the light jobs only (runner time, owner 2026-11-11); ready PRs, merge trains and
    # main run everything, so nothing reaches main without this job.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mpmv
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mpmv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpmv -d mpmv"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Chromium
        timeout-minutes: 10
        run: |
          # The ubuntu-24.04 image already has Chromium's system libraries; install-deps only adds
          # fonts. When the apt mirror is unreachable, each package waits for its timeout, so a
          # retried install-deps took 32 minutes (2026-11-11). Fail fast: short apt timeouts, one
          # attempt with a hard time limit, then continue without the extra fonts.
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "10";' 'Acquire::https::Timeout "10";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          if ! timeout -k 10 150 uv run playwright install-deps chromium; then
            echo "::warning::Playwright system dependencies could not be installed within 150 s (apt mirror unreachable?); fonts may be missing"
          fi
          for attempt in 1 2 3; do
            if uv run playwright install chromium; then
              exit 0
            fi
            echo "playwright install failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Pytest (e2e)
        run: uv run pytest -m e2e --junitxml=build/reports/junit-e2e.xml
      - name: Store screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: build/e2e/screenshots/
          if-no-files-found: ignore
      # CMP.7: the axe audit of the key public pages (tests/e2e/test_axe_audit.py): a JSON file per
      # page and a summary table. Any finding fails the e2e step above.
      - name: Accessibility audit summary
        if: always()
        run: |
          if [ -f build/e2e/axe/summary.md ]; then cat build/e2e/axe/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Store accessibility audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-axe
          path: build/e2e/axe/
          if-no-files-found: ignore
      # THM.5, spec 14 §14.10: candidate baselines (pages without one or that differ) and diffs.
      - name: Store visual baselines and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-visual
          path: |
            build/e2e/baselines/
            build/e2e/diffs/
          if-no-files-found: ignore
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: build/reports/
