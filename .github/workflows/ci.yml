# CI pipeline (ARC.4, ADR-0006). All jobs are required before merging into main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  DJANGO_SETTINGS_MODULE: mpmv.settings.test
  # Throwaway service database with trust auth: no credentials in the repository.
  DATABASE_URL: postgres://mpmv@localhost:5432/mpmv

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - name: Ruff (lint + format)
        run: |
          uv run ruff check . --output-format github
          uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy .
      - name: Import contracts (app dependency graph)
        run: uv run lint-imports
      - name: Backlog up to date with the spec
        run: uv run tools/build_docs.py --check
      - name: Django system checks and missing migrations
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      # CORE.7: publish the API v1 OpenAPI schema as a build artifact until STAGE serves it.
      - name: Export and validate the OpenAPI schema
        run: |
          mkdir -p build
          uv run python manage.py export_openapi_schema --api apps.api.v1.api.api \
            --indent 2 --output build/openapi-v1.json
          uv run openapi-spec-validator build/openapi-v1.json
      - name: Store the OpenAPI schema
        uses: actions/upload-artifact@v7
        with:
          name: openapi-v1
          path: build/openapi-v1.json
      - name: Dependency audit (pip-audit)
        run: make audit
      # OPS.4: CycloneDX SBOM of the production Python environment (no dev dependencies).
      - name: Python SBOM (CycloneDX)
        run: make sbom
      - name: Store the Python SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-python
          path: build/sbom/mpmv-python.cdx.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Unit + integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mpmv
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mpmv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpmv -d mpmv"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - name: Pytest (unit + integration)
        run: >-
          uv run pytest -m "unit or integration"
          --junitxml=build/reports/junit.xml
          --cov --cov-report=term-missing:skip-covered
          --cov-report=html:build/reports/coverage --cov-report=xml:build/reports/coverage.xml
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/

  image-build:
    # ARC.5: the Containerfile builds on a standard OCI builder (ADR-0002) and the image migrates,
    # serves and passes its own health check against PostgreSQL.
    # ARC.13: once per architecture, each on a native runner (no QEMU), so an arm64 break shows
    # up on the PR. The required check is the "Container image" gate job below.
    name: Container image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mpmv
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mpmv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpmv -d mpmv"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the Containerfile
        run: >-
          docker build --file Containerfile --tag mpmv-app:ci
          --build-arg MPMV_VERSION=ci-${GITHUB_SHA::12} .
      - name: Built for the runner's architecture
        run: test "$(docker image inspect --format '{{.Architecture}}' mpmv-app:ci)" = "${{ matrix.arch }}"
      # OPS.4: CycloneDX SBOM of the built image (OS packages and the app virtualenv), via syft.
      - run: mkdir -p build/sbom
      - name: Image SBOM (CycloneDX)
        id: sbom
        # The action downloads syft from GitHub release assets; when those downloads fail
        # (HTTP 504 on 2026-11-08), the fallback below runs the official syft image instead.
        continue-on-error: true
        uses: anchore/sbom-action@v0.24.3
        with:
          image: mpmv-app:ci
          format: cyclonedx-json
          output-file: build/sbom/mpmv-image-${{ matrix.arch }}.cdx.json
          upload-artifact: false
      - name: Image SBOM fallback (syft container)
        if: steps.sbom.outcome == 'failure'
        run: |
          chmod 0777 build/sbom
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/build/sbom:/out" \
            anchore/syft:v1.54.0 mpmv-app:ci -o cyclonedx-json=/out/mpmv-image-${{ matrix.arch }}.cdx.json
      # Fails the job when neither step produced the SBOM: never a silently missing SBOM.
      - name: Image SBOM present
        run: test -s build/sbom/mpmv-image-${{ matrix.arch }}.cdx.json
      - name: Store the image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-image-${{ matrix.arch }}
          path: build/sbom/mpmv-image-${{ matrix.arch }}.cdx.json
      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id mpmv-app:ci -u)" = "10001"
      # THM.2: every theme under themes/ has a hashed theme.css in the collected static files.
      - name: Hashed theme.css for every theme
        run: |
          docker run --rm --entrypoint python mpmv-app:ci -c '
          import json, pathlib, re
          paths = json.loads(pathlib.Path("staticfiles/staticfiles.json").read_text())["paths"]
          slugs = sorted(p.name for p in pathlib.Path("themes").iterdir() if (p / "theme.toml").is_file())
          assert slugs, "no themes"
          for slug in slugs:
              hashed = paths[f"themes/{slug}/theme.css"]
              assert re.fullmatch(rf"themes/{slug}/theme\.[0-9a-f]{{12}}\.css", hashed), hashed
              assert pathlib.Path("staticfiles", hashed).is_file(), hashed
              print(slug, "->", hashed)
          '
      - name: Migrate, serve and pass the health check
        run: |
          env_file="$RUNNER_TEMP/app.env"
          printf 'DJANGO_SECRET_KEY=%s\n' \
            "$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" > "$env_file"
          printf 'DATABASE_URL=%s\nDJANGO_ALLOWED_HOSTS=localhost\n' "$DATABASE_URL" >> "$env_file"
          # CMS.1: `check --deploy` requires a public base URL (cms.E001).
          printf 'MPMV_BASE_URL=https://mpmv.example.com\n' >> "$env_file"
          # SEC.3: a throwaway field encryption key, generated for this run only.
          printf 'MPMV_FIELD_ENCRYPTION_KEYS=ci:%s\n' \
            "$(python3 -c 'import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')" \
            >> "$env_file"
          run="docker run --network host --env-file $env_file --read-only --tmpfs /tmp"
          $run --rm mpmv-app:ci migrate
          $run --rm mpmv-app:ci manage check --deploy --fail-level ERROR
          $run -d --name mpmv-app-ci mpmv-app:ci web
          for _ in $(seq 30); do
            if docker exec mpmv-app-ci python -m mpmv.healthcheck; then exit 0; fi
            sleep 1
          done
          docker logs mpmv-app-ci
          exit 1

  image:
    # Branch protection requires this check. It passes only when both architectures passed; it
    # runs even when a build fails, because a skipped required check would count as passing.
    name: Container image
    needs: image-build
    if: always()
    runs-on: ubuntu-24.04
    env:
      BUILD_RESULT: ${{ needs.image-build.result }}
    steps:
      - name: Both architectures built and passed
        run: test "$BUILD_RESULT" = success

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mpmv
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mpmv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpmv -d mpmv"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Pytest (e2e)
        run: uv run pytest -m e2e --junitxml=build/reports/junit-e2e.xml
      - name: Store screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: build/e2e/screenshots/
          if-no-files-found: ignore
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: build/reports/
