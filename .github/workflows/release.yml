# Release images (ARC.5, ADR-0005). A git tag vX.Y.Z on main publishes the immutable image
# ghcr.io/<owner>/mpmv-app:X.Y.Z (plus sha-<commit>). STAGE and LIVE deploy these tags with
# deploy/server/mpmv-deploy; see deploy/README.md.
# OPS.4: the GitHub release for the tag carries the CycloneDX SBOMs of the Python environment and
# of the published image (docs/dev/dependency-updates.md). Only the small attach job, which runs no
# third-party action, can write to the repository; the image job builds and pushes with a
# read-only repository token. Third-party actions in a job with a write token are pinned by commit.
name: Release image

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mpmv-app" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Log in to the registry
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing release
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists; release tags are immutable" >&2
            exit 1
          fi
      - name: Build
        run: >-
          docker build --file Containerfile --build-arg MPMV_VERSION="$VERSION"
          --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-${GITHUB_SHA::12}" .
      - name: Python SBOM (CycloneDX)
        run: make sbom
      - name: Image SBOM (CycloneDX)
        id: sbom
        # Fallback below when syft cannot be downloaded from GitHub release assets.
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: cyclonedx-json
          output-file: build/sbom/mpmv-image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Image SBOM fallback (syft container)
        if: steps.sbom.outcome == 'failure'
        run: |
          mkdir -p build/sbom && chmod 0777 build/sbom
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/build/sbom:/out" \
            anchore/syft:v1.54.0 "$IMAGE:$VERSION" -o cyclonedx-json=/out/mpmv-image.cdx.json
      - name: Image SBOM present
        run: test -s build/sbom/mpmv-image.cdx.json
      - name: Push
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
      - name: Store the SBOMs for the attach job
        uses: actions/upload-artifact@v7
        with:
          name: release-sboms
          path: build/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  attach:
    name: Attach the SBOMs to the GitHub release
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release and attach the SBOMs
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-sboms
          path: build/sbom
      - name: Create the release and upload the SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "build/sbom/mpmv-python.cdx.json#SBOM (CycloneDX): Python environment" \
            "build/sbom/mpmv-image.cdx.json#SBOM (CycloneDX): container image"
