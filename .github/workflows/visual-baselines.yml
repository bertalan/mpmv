# THM.5, spec 14 §14.10: render the visual baselines on the CI runner (Linux Chromium).
# Run it by hand on a branch (Actions > Visual baselines > Run workflow, or
# `gh workflow run visual-baselines.yml --ref <branch>`), download the `visual-baselines`
# artifact, commit the PNGs under tests/e2e/baselines/ and review them in the pull request.
name: Visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  DJANGO_SETTINGS_MODULE: mpmv.settings.test
  # Throwaway service database with trust auth: no credentials in the repository.
  DATABASE_URL: postgres://mpmv@localhost:5432/mpmv

jobs:
  baselines:
    name: Render visual baselines
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mpmv
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mpmv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpmv -d mpmv"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Chromium
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          deps_ok=0
          for attempt in 1 2 3; do
            if uv run playwright install-deps chromium; then
              deps_ok=1
              break
            fi
            echo "playwright install-deps failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          if [ "$deps_ok" -ne 1 ]; then
            echo "::error::Playwright system dependencies could not be installed (apt mirror unreachable?); refusing to render baselines without system fonts"
            exit 1
          fi
          for attempt in 1 2 3; do
            if uv run playwright install chromium; then
              exit 0
            fi
            echo "playwright install failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Render baselines
        env:
          MPMV_VISUAL: update
        run: uv run pytest -m e2e -k visual_baseline
      - name: Store baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/e2e/baselines/
          if-no-files-found: error
